name: Keep Space Awake

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hugging Face Space
        run: |
          echo "Pinging FarAway Orbital Space..."
          curl -f -s https://roastedtomato-farawayorbitalcomputesystem.hf.space/health || true
